    get:
      operationId: auth_oauth_start_retrieve
      description: 'Browser navigation: redirects to the provider.'
      parameters:
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - link
          - login
        description: link attaches to the signed in user.
      - in: query
        name: next
        schema:
          type: string
        description: Frontend path to go back to, must start with /.
      - in: path
        name: provider
        schema:
          type: string
        required: true
      - in: query
        name: remember
        schema:
          type: boolean
        description: Long lived session after login.
      tags:
      - oauth
      security:
      - apiKey: []
      - session: []
      - {}
      responses:
        '302':
          description: Redirect to the provider
