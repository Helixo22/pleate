openapi: 3.0.3
info:
  title: pleate-backend API
  version: 0.1.0
  description: REST API that backs the pleate components.
paths:
  /api/activity:
    get:
      operationId: activity_list
      description: 'What the signed in user did: logins, password changes, edits...'
      summary: My activity, newest first
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: Exact action, for example auth.login.
      - in: query
        name: action__startswith
        schema:
          type: string
        description: Action prefix, for example auth.
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - activity
      security:
      - apiKey: []
      - session: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityLogList'
          description: ''
  /api/activity/all:
    get:
      operationId: activity_all_list
      summary: Every activity entry (staff)
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: Exact action, for example auth.login.
      - in: query
        name: action__startswith
        schema:
          type: string
        description: Action prefix, for example auth.
      - in: query
        name: actor
        schema:
          type: string
        description: User id.
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: target_id
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - activity
      security:
      - apiKey: []
      - session: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityLogList'
          description: ''
  /api/activity/all/{id}:
    get:
      operationId: activity_all_retrieve
      summary: One activity entry (staff)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - activity
      security:
      - apiKey: []
      - session: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLog'
          description: ''
  /api/ai/conversations:
    get:
      operationId: ai_conversations_list
      parameters:
      - in: query
        name: archived
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: pinned
        schema:
          type: boolean
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - ai
      security:
      - apiKey: []
      - session: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConversationList'
          description: ''
    post:
      operationId: ai_conversations_create
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConversationRequest'
      security:
      - apiKey: []
      - session: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
  /api/ai/conversations/{id}:
    get:
      operationId: ai_conversations_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - apiKey: []
      - session: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
    patch:
      operationId: ai_conversations_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedConversationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedConversationRequest'
      security:
      - apiKey: []
      - session: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
    delete:
      operationId: ai_conversations_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - apiKey: []
      - session: []
      responses:
        '204':
          description: No response body
  /api/ai/conversations/{id}/messages:
    get:
      operationId: ai_conversations_messages_list
      description: Cursor paginated. The first page has the latest messages, `next_cursor`
        loads older ones. Messages inside a page are in chronological order.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - sse
      - in: path
        name: id
        schema:
          type: string
        required: true
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - ai
      security:
      - apiKey: []
      - session: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessageList'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/PaginatedMessageList'
          description: ''
    post:
      operationId: ai_conversations_messages_create
      description: Sends a message and streams the answer.
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - sse
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      security:
      - apiKey: []
      - session: []
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                Stream:
                  value: |+
                    event: user_message
                    data: {"message": {...}}

                    event: start
                    data: {"message": {"status": "streaming", ...}}

                    event: delta
                    data: {"text": "Hello"}

                    event: done
                    data: {"message": {"status": "complete", ...}}

          description: 'Server-Sent Events stream (default). Events, in order: `user_message`
            {message} (send only), `start` {message}, then any number of `delta` {text},
            `reasoning` {text}, `sources` {sources}, then `error` {code, message,
            message_id} when the provider failed, and always `done` {message} last.
            Send `Accept: application/json` to get a single JSON response after completion
            instead.'
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'
          description: ''
  /api/ai/messages/{id}/regenerate:
    post:
      operationId: ai_messages_regenerate_create
      description: Answers again the last assistant message. The previous answer is
        kept in ``variants``.
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - sse
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegenerateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegenerateRequest'
      security:
      - apiKey: []
      - session: []
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/RegenerateResponse'
          description: 'Server-Sent Events stream (default). Events, in order: `user_message`
            {message} (send only), `start` {message}, then any number of `delta` {text},
            `reasoning` {text}, `sources` {sources}, then `error` {code, message,
            message_id} when the provider failed, and always `done` {message} last.
            Send `Accept: application/json` to get a single JSON response after completion
            instead.'
  /api/ai/messages/{id}/stop:
    post:
      operationId: ai_messages_stop_create
      description: Asks the running generation to stop. The stream then ends with
        ``done`` and status ``stopped``.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - ai
      security:
      - apiKey: []
      - session: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
