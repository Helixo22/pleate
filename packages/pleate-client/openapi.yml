        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api-keys
      security:
      - apiKey: []
      - session: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAPIKeyList'
          description: ''
    post:
      operationId: api_keys_create
      description: The response carries the full `key`. It is never shown again.
      summary: Create an API key
      tags:
      - api-keys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/APIKeyCreateRequest'
        required: true
      security:
      - apiKey: []
      - session: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreated'
          description: ''
  /api/api-keys/{id}:
    get:
      operationId: api_keys_retrieve
      summary: Get an API key
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api-keys
      security:
      - apiKey: []
      - session: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
          description: ''
    patch:
      operationId: api_keys_partial_update
      summary: Rename an API key
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
