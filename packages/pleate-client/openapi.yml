  /api/auth/oauth/{provider}/callback:
    get:
      operationId: auth_oauth_callback_retrieve
      description: |-
        Where the provider sends the browser back. GET for most providers, POST for
        Apple (``form_post``). The POST is turned into a GET with a 303 redirect: the
        session cookie is SameSite=Lax, so a cross site POST does not carry it, while
        the top level GET that follows does. CSRF does not apply, the state does.
      parameters:
      - in: query
        name: code
        schema:
          type: string
      - in: query
        name: error
        schema:
          type: string
      - in: path
        name: provider
        schema:
          type: string
        required: true
      - in: query
        name: state
        schema:
          type: string
      tags:
      - oauth
      security:
      - {}
      responses:
        '302':
          description: Redirect to the frontend OAUTH_DONE page
    post:
      operationId: auth_oauth_callback_create
      description: |-
        Where the provider sends the browser back. GET for most providers, POST for
        Apple (``form_post``). The POST is turned into a GET with a 303 redirect: the
        session cookie is SameSite=Lax, so a cross site POST does not carry it, while
        the top level GET that follows does. CSRF does not apply, the state does.
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - oauth
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
      security:
      - {}
      responses:
        '303':
          description: Redirect to the same callback with GET
